name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Script syntax
        run: for f in scripts/*.sh .github/scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh .github/scripts/*.sh

      - name: JSON
        run: for f in .claude-plugin/*.json; do jq empty "$f"; done

      - name: Directory rules (no symlinks, no .DS_Store, files under 256 KiB)
        run: |
          set -euo pipefail
          bad=$(find . -path ./.git -prune -o \( -type l -o -name .DS_Store -o -size +256k \) -print)
          [ -z "$bad" ] || { echo "::error::Not allowed in the plugin: $bad"; exit 1; }

      - name: Validate the plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
