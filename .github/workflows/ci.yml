name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    # The "Protect main" ruleset requires this check by name.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release scripts (syntax and ShellCheck)
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning .github/scripts/*.sh

      - name: JSON
        run: for f in .claude-plugin/*.json wp-repo-standard/.claude-plugin/*.json; do jq empty "$f"; done

      # The Claude plugin directory accepts only these files from organizations
      # that aren't Verified: Markdown, text, JSON, YAML and PNG/JPEG/GIF/WebP/ICO
      # images (plus LICENSE), none starting with "#!", each under 256 KiB, no
      # symlinks. Keep scripts outside the plugin folder.
      - name: Root icon matches the plugin icon
        run: cmp .claude-plugin/icon.png wp-repo-standard/.claude-plugin/icon.png || { echo "::error::.claude-plugin/icon.png differs from wp-repo-standard/.claude-plugin/icon.png. The plugin directory reads the root copy; update both."; exit 1; }

      - name: Plugin folder contains only allowed files
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.md|*.txt|*.json|*.yml|*.yaml|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*/LICENSE) ;;
              *) echo "::error file=$f::File type not allowed in the plugin folder"; bad=1 ;;
            esac
            if [ "$(head -c 2 "$f")" = '#!' ]; then echo "::error file=$f::Starts with #!"; bad=1; fi
            if [ "$(wc -c < "$f")" -gt 262144 ]; then echo "::error file=$f::Larger than 256 KiB"; bad=1; fi
          done < <(find wp-repo-standard -type f -print0)
          if [ -n "$(find wp-repo-standard -type l -o -name .DS_Store)" ]; then echo "::error::Symlinks or .DS_Store in the plugin folder"; bad=1; fi
          exit "$bad"

      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate wp-repo-standard --strict

      - name: Validate the marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
