name: Release

# Every merge to main is checked; a release is made only when a plugin file
# changed since the last release (.github/scripts/release-plan.sh lists them).
# README-, CI- or config-only merges make no release.
#
#   1. Work out the next version (patch by default; the merged PR's
#      `release:minor` / `release:major` label bumps more) and the changelog
#      (one line per issue the released PRs closed).
#   2. Write the version into wp-repo-standard/.claude-plugin/plugin.json and the entry into
#      CHANGELOG.md, and commit that to main as "Release vX.Y.Z".
#      Pushed with the RELEASE_DEPLOY_KEY deploy key, which the ruleset lets bypass.
#   3. Tag that commit and publish the GitHub release.
#
# Claude Code sees a new version through the "version" field, so users get it
# with /plugin marketplace update (or auto-update).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The bot's own release commit never needs another release. Checked by
    # author too, so a human PR titled "Release v…" is still released.
    if: >-
      ${{ !(startsWith(github.event.head_commit.message, 'Release v')
      && github.event.head_commit.author.email == '41898282+github-actions[bot]@users.noreply.github.com') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare
        run: echo "CHANGELOG_FILE=$RUNNER_TEMP/changelog.txt" >> "$GITHUB_ENV"

      - name: Check out main with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Plan release
        id: plan
        run: bash .github/scripts/release-plan.sh

      - name: Write version and changelog
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bash .github/scripts/stamp-version.sh "$VERSION" "$CHANGELOG_FILE"
          git diff

      - name: Commit release to main
        if: steps.plan.outputs.release == 'true'
        id: commit
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "Version and changelog already up to date."
          else
            git commit --all --message "Release $TAG" --message "$(cat "$CHANGELOG_FILE")"
            if ! git push origin HEAD:main; then
              echo "::error::Could not push the release commit to main. Check the RELEASE_DEPLOY_KEY secret, the 'release-bot' deploy key and that the 'Protect main' ruleset lets deploy keys bypass (bin/setup-github.sh in wordpress-plugin-boilerplate sets these up)."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag and publish GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$CHANGELOG_FILE"
